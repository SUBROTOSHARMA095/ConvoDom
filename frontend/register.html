<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register | ChatApp</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Segoe UI, Arial, sans-serif;
}

body{
    background:#0f172a;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

#card{
    width:380px;
    background:#1e293b;
    padding:35px;
    border-radius:15px;
    box-shadow:0 10px 30px rgba(0,0,0,.35);
}

h1{
    color:white;
    text-align:center;
    margin-bottom:30px;
}

.inputBox{
    margin-bottom:18px;
}

label{
    display:block;
    color:#cbd5e1;
    margin-bottom:6px;
    font-size:15px;
}

input{
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    background:#334155;
    color:white;
    font-size:15px;
}

input:focus{
    outline:2px solid #3b82f6;
}

button{
    width:100%;
    padding:13px;
    border:none;
    border-radius:10px;
    background:#3b82f6;
    color:white;
    font-size:16px;
    cursor:pointer;
    transition:.2s;
}

button:hover{
    background:#2563eb;
}

#error{
    color:#ef4444;
    text-align:center;
    margin-bottom:15px;
    min-height:18px;
}

#login{
    text-align:center;
    margin-top:20px;
    color:#94a3b8;
}

#login a{
    color:#3b82f6;
    text-decoration:none;
}

</style>
</head>

<body>

<div id="card">

<h1>Create Account</h1>

<div id="error"></div>

<form id="registerForm">

<div class="inputBox">
<label>Username</label>
<input type="text" id="username" required>
</div>

<div class="inputBox">
<label>Password</label>
<input type="password" id="password" required>
</div>

<div class="inputBox">
<label>Confirm Password</label>
<input type="password" id="confirmPassword" required>
</div>

<button type="submit">Create Account</button>

</form>

<div id="login">
Already have an account?
<a href="/">Login</a>
</div>

</div>

<script>

const form=document.getElementById("registerForm");
const error=document.getElementById("error");

form.addEventListener("submit",async(e)=>{

    e.preventDefault();

    const username=document.getElementById("username").value.trim();
    const password=document.getElementById("password").value;
    const confirmPassword=document.getElementById("confirmPassword").value;

    error.textContent="";

    if(password!==confirmPassword){
        error.textContent="Passwords do not match.";
        return;
    }

    try{

        const response=await fetch("/register",{

            method:"POST",

            headers:{
                "Content-Type":"application/json"
            },

            body:JSON.stringify({
                username,
                password
            })

        });

        const result=await response.json();

        if(response.ok){

            alert("Account created successfully!");

            window.location="/";

        }
        else{

            error.textContent=result.message || "Registration failed.";

        }

    }

    catch(err){

        error.textContent="Unable to connect to server.";

    }

});

</script>

</body>
</html>
