<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome to ConvoDOM</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Segoe UI, Arial, sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#0f172a;
    color:#f8fafc;
}

#container{
    width:400px;
    padding:40px;
    background:#1e293b;
    border-radius:18px;
    box-shadow:0 10px 30px rgba(0,0,0,.35);
    text-align:center;
}

h1{
    font-size:2.4rem;
    margin-bottom:10px;
}

h3{
    color:#94a3b8;
    font-weight:400;
    margin-bottom:35px;
}

.action{
    margin:18px 0;
}

.btn{
    display:block;
    width:100%;
    padding:14px;
    background:#3b82f6;
    color:white;
    text-decoration:none;
    border-radius:10px;
    font-weight:600;
    transition:.2s;
}

.btn:hover{
    background:#2563eb;
    transform:translateY(-2px);
}

p{
    margin-top:25px;
    color:#94a3b8;
    font-size:.9rem;
}

</style>
</head>

<body>

<div id="container">

    <h1>ConvoDOM</h1>
    <h3>Fast • Secure • Real-Time Messaging</h3>

    <div class="action">
        <a class="btn" href="/login.html">Login</a>
    </div>

    <div class="action">
        <a class="btn" href="/register.html">Create Account</a>
    </div>

    <p>Welcome to your next conversation.</p>

</div>

</body>
</html>
